<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e8">
  <title>回声训练室 · 产品演示</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="回到首页"><span class="brand-mark">↗</span><span>回声<span class="brand-light">训练室</span></span></button>
      <span class="demo-pill">交互演示 · 模拟数据</span>
    </header>
    <main id="screen" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button data-action="home" id="nav-home">⌂<span>首页</span></button>
      <button data-action="history" id="nav-history">◷<span>复盘</span></button>
      <button data-action="profile" id="nav-profile">◯<span>我的</span></button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>请在支持 JavaScript 的浏览器中打开回声训练室。</noscript>
  <script src="./app.js"></script>
</body>
</html>
